<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>无限轮回 — 原型</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>无限轮回（原型）</h1>
      <div id="resources">点数：<span id="res-points">0</span></div>
    </header>

    <main id="main-screen">
      <button id="btn-start">开始轮回</button>
      <div id="home" class="panel">
        <h2>主神空间</h2>
        <div id="idle-panel">
          挂机：<span id="idle-rate">--</span> 点/秒
          <button id="btn-toggle-idle">开启挂机</button>
        </div>
        <div id="inventory-panel" class="panel small">
          <h3>背包</h3>
          <div id="inventory-list"></div>
        </div>
        <div id="equips-panel" class="panel small">
          <h3>装备</h3>
          <div id="equips-list"></div>
        </div>
        <div id="party"></div>
        <div class="controls">
          <button id="btn-venture">进入副本（战斗演示）</button>
          <button id="btn-start-dungeon">开始副本（随机路线）</button>
          <button id="btn-open-inventory">打开背包</button>
          <button id="btn-recruit-one">招募一次</button>
          <button id="btn-recruit-ten">十连招募</button>
          <button id="btn-save">保存进度</button>
          <button id="btn-load">读取进度</button>
        </div>
      </div>

      <div id="battle" class="panel hidden">
        <h2>战斗</h2>
        <div id="battle-log"></div>
        <div class="controls">
          <button id="btn-attack">执行战斗回合</button>
          <button id="btn-end-battle">结束战斗</button>
        </div>
      </div>

      <div id="dungeon" class="panel hidden">
        <h2>副本探险</h2>
        <div id="dungeon-log"></div>
        <div class="controls">
          <button id="btn-next-node">推进节点</button>
          <button id="btn-exit-dungeon">退出副本</button>
        </div>
      </div>

      <div id="event-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="event-title"></h3>
          <p id="event-desc"></p>
          <div id="event-choices"></div>
          <button id="btn-close-event">关闭</button>
        </div>
      </div>

    </main>

    <footer>
      <small>演示版 — 静态部署支持手机访问（GitHub Pages）</small>
    </footer>
  </div>
  <script src="js/config.js"></script>
  <script src="js/v5data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
