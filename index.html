<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>无限轮回</title>
<style>
:root{--bg:#0b0b0f;--panel:#16161d;--card:#1f1f29;--accent:#c0392b;--gold:#d4af37;--text:#e8e8e8;--muted:#888;--green:#2ecc71;--blue:#74b9ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{max-width:470px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#topbar{height:54px;background:var(--panel);display:flex;align-items:center;padding:0 6px;gap:4px;border-bottom:1px solid #333;flex-shrink:0}
.cur{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}
.cur b{display:block;color:var(--gold);font-size:12px}
#main{flex:1;overflow-y:auto;padding:10px 12px}
#tabs{height:58px;background:var(--panel);display:flex;border-top:1px solid #333;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer}
.tab.active{color:var(--gold)}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border-radius:8px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
.btn{background:var(--accent);border:none;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn2{background:#333}
.btn3{background:var(--blue)}
.sml{padding:5px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stage{padding:8px 0;text-align:center;background:#2a2a35;border-radius:6px;font-size:12px;cursor:pointer}
.stage.cleared{background:#2e4a35;color:#7bed9f}
.stage.boss{color:var(--gold)}
h3{color:var(--gold);font-size:15px;margin-bottom:8px}
h4{font-size:14px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:12px}
.log{padding:5px 0;border-bottom:1px solid #2a2a35;font-size:13px}
.log .crit{color:#ff6b6b;font-weight:700}
.log .heal{color:var(--green)}
.log .skill{color:var(--blue)}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;z-index:100}
.modal.active{display:flex}
.modal-content{background:var(--panel);margin:8px;border-radius:10px;flex:1;overflow-y:auto;padding:12px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#battleMain{flex:1;overflow-y:auto;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0}
.bar{height:18px;background:#333;border-radius:9px;overflow:hidden;margin:3px 0}
.bar div{height:100%;background:var(--accent);transition:width .2s}
.item-line{display:flex;justify-content:space-between;align-items:center;padding:6px;background:#2a2a35;border-radius:6px;margin:4px 0;font-size:12px;flex-wrap:wrap}
select,input{background:#2a2a35;border:1px solid #444;color:#fff;padding:6px;border-radius:4px;font-size:13px}
.bad{color:#ff6b6b}.good{color:#7bed9f}
.tag{font-size:10px;background:#333;padding:2px 5px;border-radius:4px;margin-right:3px}
</style>
</head>

let state;
function newState(){return{name:'',bloodline:'vampire',geneLock:0,blStage:{vampire:0,werewolf:0,cultivator:0,magic:0,tech:0,psychic:0},dims:{muscle:1,immune:1,cell:1,nerve:1,intel:1,spirit:1},buildings:{sanctuary:0,medical:0,training:0},points:0,plot:0,crystal:0,holy:0,maps:{},chars:[],active:[],inventory:[],nextUid:1,achievements:{},bounties:{date:null,list:[]},tower:{unlocked:false,best:0},stats:{bossKills:0,kills:0,totalBattles:0,totalPoints:0,consecutiveLoss:0,injuryEnd:0,explore:0,sets:0,potions:0,winStreak:0},potions:{atk:0,shield:0,revive:0},settings:{speed:1},flags:{intro:true},unlockedBlood:{vampire:true},lastTick:Date.now()}}
}
const CUR='wxlh_cur';
let tmpSkillFix={};
function loadSlot(n){try{const d=localStorage.getItem('wxlh_slot_'+n);return d?JSON.parse(d):null}catch(e){return null}}
function saveGame(){const n=+localStorage.getItem(CUR)||1;state.lastTick=Date.now();localStorage.setItem('wxlh_slot_'+n,JSON.stringify(state));toast('已保存')}
function init(){
 let slot=+localStorage.getItem(CUR)||1; state=loadSlot(slot);
 if(!state){state=newState();}
 offlineTick();
 applyOffline();
 if(state.flags.intro) showIntro();
 render();
 setInterval(tick,1000);
 setInterval(saveGame,20000);
 document.addEventListener('keydown',gmKey);
}
function offlineTick(){const now=Date.now();const last=state.lastTick||now;const sec=(now-last)/1000;const cap=(8+state.buildings.medical)*3600;const eff=Math.min(1,0.6+state.buildings.medical*0.02);const gain=Math.min(sec,cap)*idleRate()*eff;if(gain>0){state.points+=gain;state.stats.totalPoints+=gain;}}
function idleRate(){if(Date.now()<state.stats.injuryEnd)return idleBase()*0.5;return idleBase();}
function idleBase(){return (1+state.buildings.sanctuary*2)*GENE[state.geneLock].m;}
function tick(){offlineTick(); state.lastTick=Date.now(); const rate=idleRate(); state.points+=rate; state.stats.totalPoints+=rate; updateTop();}
function applyOffline(){if(state.points>0)toast('离线收益已结算');}

// ================= 数值计算 =================
function dimCost(stat){return Math.floor(25*Math.pow(1.15,state.dims[stat]))}
function achBonus(){let b=0;for(let id in state.achievements)if(state.achievements[id]){const a=ACHS.find(x=>x.id===id);if(a)b+=a.b;}return b;}
function baseStats(){
 const m=GENE[state.geneLock].m*(1+achBonus()+state.buildings.training*0.02);
 let atk=(state.dims.muscle+0.6*Math.pow(state.dims.muscle,1.6))*m;
 let def=(state.dims.immune+0.5*Math.pow(state.dims.immune,1.6))*m;
 let hp=(50+8*state.dims.cell+6*Math.pow(state.dims.cell,1.6))*m;
 let spd=10+0.5*state.dims.nerve;
 let crit=Math.min(5+0.3*state.dims.intel,60);
 let eva=Math.min(5+0.35*state.dims.nerve,45);
 let spirit=1+state.dims.spirit*0.015;
 const bl=BLOOD[state.bloodline].stages[state.blStage[state.bloodline]];
 if(bl.defp)def*=1+bl.defp;
 return {atk,def,hp,spd,crit,eva,spirit};
}
function playerEquipStats(){

 const sets={};
 SLOTS_P.forEach(slot=>{const uid=state.equip&&state.equip[slot]; if(uid)sumItem(uid,s,sets);});
 state.active.forEach(cid=>{const c=state.chars.find(x=>x.id===cid); if(c)c.equipped.forEach(uid=>{if(uid)sumItem(uid,s,sets);});});
 for(let sid in sets)if(sets[sid]>=3){const se=SETS.find(x=>x.id===sid);applySet(se,s);}
 return s;
}
function sumItem(uid,s,sets){
 const it=state.inventory.find(x=>x.uid===uid); if(!it)return;
 const qm=QUALITIES[it.q].m*(1+it.enh*0.05);
 if(it.main==='all'){s.atk+=it.val*qm;s.def+=it.val*qm;s.hp+=it.val*qm;}else if(it.main==='atk')s.atk+=it.val*qm;else if(it.main==='def')s.def+=it.val*qm;else if(it.main==='hp')s.hp+=it.val*qm;else if(it.main==='spd')s.spd+=it.val*qm;else if(it.main==='intel')s.intel+=it.val*qm;else if(it.main==='spirit')s.spirit+=it.val*qm;
 it.subs.forEach(sb=>{if(sb.stat==='all'){s.atk+=sb.val;s.def+=sb.val;s.hp+=sb.val;}else s[sb.stat]+=sb.val;});
 if(it.setId)sets[it.setId]=(sets[it.setId]||0)+1;
}
function applySet(se,s){
 if(se.eff==='dmgRed')s.dmgRed+=se.v;if(se.eff==='thorns')s.thorns+=se.v;if(se.eff==='regen')s.regen+=se.v;
 if(se.eff==='skill')s.skillMult+=se.v;if(se.eff==='evade')s.eva+=se.v*100;if(se.eff==='critRate')s.crit+=se.v*100;
 if(se.eff==='enemyAtk')s.enemyAtk+=se.v;if(se.eff==='hp')s.hp*=1+se.v;if(se.eff==='poison')s.poison+=se.v;
 if(se.eff==='killHeal')s.killHeal+=se.v;if(se.eff==='shield')s.shieldBoost=se.v;if(se.eff==='allStat'){s.atk*=1.1;s.def*=1.1;s.hp*=1.1;}
}
function combatStats(){
 const b=baseStats(); const e=playerEquipStats();
 let atk=(b.atk+e.atk)*(1+e.allPct); let def=(b.def+e.def)*(1+e.allPct); let hp=(b.hp+e.hp)*(1+e.allPct);
 let spd=b.spd+e.spd; let crit=b.crit+e.crit; let eva=b.eva+e.eva; let spirit=b.spirit*(1+e.spirit*0.01+e.skillMult);
 if(state.potions.atk>0)atk*=1.25;
 return {atk,def,hp,spd,crit,eva,spirit,leech:e.leech,counter:e.counter,regen:e.regen,dmgRed:e.dmgRed,thorns:e.thorns,poison:e.poison,killHeal:e.killHeal};
}
function power(){const c=combatStats();return c.atk*1.2+c.def*1.0+c.hp*0.08;}
function enemyStats(mapId,stage,diff){
 const d=DIFF[diff]; const mapLv=(mapId-1)*12+stage;
 let hp=80*Math.pow(1.35,mapId-1)*Math.pow(1.75,stage-1)*d.hp; if(stage===12)hp*=2.5;
 let atk=(5+hp*0.004)*d.atk; let def=hp*0.02; let spd=10+mapId*2+stage*0.5;
 return {name:stage===12?MAPS[mapId-1].boss:(MAPS[mapId-1].n+'小怪'),hp:Math.floor(hp),maxHp:Math.floor(hp),atk:Math.floor(atk),def:Math.floor(def),spd:Math.floor(spd),stage,mapId,diff};
}

let battleTimer=null,battleLog=[];
function startBattle(mapId,stage,diff){
 const enemy=enemyStats(mapId,stage,diff);
 if(power()<enemy.hp*1.2*0.8+enemy.atk+enemy.def*0.08 && !confirm('战力略低，确定挑战？'))return;
 openBattleModal(enemy);
 const ctx={enemy,log:[],round:0,shield:0,revive:state.potions.revive>0,deathSave:false,win:false,over:false,pBuff:{atk:0,def:0,crit:0,eva:0},eBuff:{atk:0,def:0},eStun:0,pStun:0};
 if(state.potions.shield>0){ctx.shield=Math.floor(combatStats().hp*0.3);state.potions.shield--;saveGame();}
 simulateBattle(ctx);
}
function simulateBattle(ctx){
 const p=combatStats(); ctx.p=p; ctx.p.curHp=p.hp; ctx.enemy.curHp=ctx.enemy.maxHp;
 for(let r=1;r<=80;r++){
   ctx.round=r;
   ctx.log.push(`<div class="log"><b>第${r}回合</b></div>`);
   // regen
   let regen=0;
   const bls=BLOOD[state.bloodline].stages[state.blStage[state.bloodline]];
   if(bls.regen)regen+=bls.regen*p.hp;
   if(GENE[state.geneLock].pass.regen)regen+=GENE[state.geneLock].pass.regen*p.hp;
   if(p.regen)regen+=p.regen*p.hp;
   if(regen>0){ctx.p.curHp=Math.min(p.hp,ctx.p.curHp+regen);ctx.log.push(`<div class="log heal">你回复 ${fmt(regen)} 生命</div>`);}
   // ally skills
   state.active.forEach(cid=>{if(Math.random()<0.15+getChar(cid).star*0.05+GENE[state.geneLock].pass.allyTrig)allySkill(cid,ctx);});
   // magic storm
   if(state.bloodline==='magic' && r%bls.storm===0){let dmg=p.atk*bls.sd; dmg=applyDmgMods(dmg,ctx.p,null,true); ctx.enemy.curHp-=dmg;ctx.log.push(`<div class="log skill">真伤风暴造成 ${fmt(dmg)} 伤害</div>`); if(ctx.enemy.curHp<=0){win(ctx);return;}}
   // actor order
   const pFirst=p.spd>=ctx.enemy.spd;
   if(pFirst){if(!ctx.pStun)playerHit(ctx); else {ctx.log.push(`<div class="log">你被眩晕，跳过行动</div>`);ctx.pStun=0;}}
   else {if(!ctx.eStun)enemyHit(ctx); else {ctx.log.push(`<div class="log">敌人被眩晕，跳过行动</div>`);ctx.eStun=0;}}
   if(checkEnd(ctx))return;
   if(!pFirst){if(!ctx.pStun)playerHit(ctx); else ctx.pStun=0;}
   else {if(!ctx.eStun)enemyHit(ctx); else ctx.eStun=0;}
   if(checkEnd(ctx))return;
   // buffs decay
   ctx.pBuff.atk*=0.5; ctx.pBuff.def*=0.5; ctx.pBuff.crit*=0.5; ctx.pBuff.eva*=0.5; ctx.eBuff.atk*=0.5; ctx.eBuff.def*=0.5;
 }
 ctx.log.push(`<div class="log bad">战斗超时，你撤退了</div>`); lose(ctx);
}
function playerHit(ctx){
 const p=ctx.p; const e=ctx.enemy; let name='你的攻击';
 doHit(p,e,name,ctx,true);
 if(state.bloodline==='werewolf' || GENE[state.geneLock].pass.combo){
   let combo=BLOOD[state.bloodline].stages[state.blStage[state.bloodline]].combo||0; combo+=GENE[state.geneLock].pass.combo||0;
   if(Math.random()<combo){ctx.log.push(`<div class="log">连击！</div>`);doHit({...p,atk:p.atk*0.6},e,name,ctx,true);}
 }
}
function doHit(att,def,name,ctx,isPlayer){
 let target=isPlayer?ctx.enemy:ctx.p; let source=isPlayer?ctx.p:ctx.enemy;
 if(Math.random()<(isPlayer?target.eva:source.eva)/100){ctx.log.push(`<div class="log">${name} 被闪避！</div>`); if(isPlayer && ctx.p.counter){let cdm=ctx.p.atk*ctx.p.counter; ctx.enemy.curHp-=cdm;ctx.log.push(`<div class="log skill">闪避反击 ${fmt(cdm)}</div>`);} return;}
 let atk=att.atk*(1+(isPlayer?ctx.pBuff.atk:ctx.eBuff.atk));
 let dfn=def.def*(1+(isPlayer?ctx.eBuff.def:ctx.pBuff.def));
 if(isPlayer && ctx.pBuff.atkPen)dfn*=1-ctx.pBuff.atkPen;
 let dmg=Math.max(1,atk*atk/(atk+dfn));
 dmg*=(0.9+Math.random()*0.2);
 let crit=false; if(Math.random()<(isPlayer?ctx.p.crit:5)/100){dmg*=2;crit=true;}
 if(isPlayer){dmg*=1.25; if(state.potions.atk>0)dmg*=1.25;}
 if(!isPlayer && ctx.p.dmgRed)dmg*=1-ctx.p.dmgRed;
 if(!isPlayer && BLOOD[state.bloodline].stages[state.blStage[state.bloodline]].red)dmg*=1-BLOOD[state.bloodline].stages[state.blStage[state.bloodline]].red;
 if(!isPlayer && GENE[state.geneLock].pass.red)dmg*=1-GENE[state.geneLock].pass.red;
 dmg=Math.floor(dmg);
 if(isPlayer){applyDmgToEnemy(dmg,ctx,crit);}else{applyDmgToPlayer(dmg,ctx);}
 ctx.log.push(`<div class="log">${name} 造成 ${fmt(dmg)} 伤害${crit?' <span class="crit">暴击！</span>':''}</div>`);
 if(isPlayer){const leech=ctx.p.leech+(BLOOD[state.bloodline].stages[state.blStage[state.bloodline]].leech||0); if(leech>0){const h=Math.floor(dmg*leech); ctx.p.curHp=Math.min(ctx.p.hp,ctx.p.curHp+h); ctx.log.push(`<div class="log heal">吸血 ${fmt(h)}</div>`);}}
 if(!isPlayer && ctx.p.thorns){const t=Math.floor(dmg*ctx.p.thorns); ctx.enemy.curHp-=t;ctx.log.push(`<div class="log skill">反伤 ${fmt(t)}</div>`);}
}
function applyDmgToEnemy(dmg,ctx,crit){
 if(ctx.p.poison>0 && Math.random()<0.5)ctx.log.push(`<div class="log skill">毒伤触发</div>`);
 ctx.enemy.curHp-=dmg;
}
function applyDmgToPlayer(dmg,ctx){
 if(ctx.shield>0){if(ctx.shield>=dmg){ctx.shield-=dmg;ctx.log.push(`<div class="log skill">护盾吸收 ${fmt(dmg)}</div>`);return;}else{dmg-=ctx.shield;ctx.log.push(`<div class="log skill">护盾破碎</div>`);ctx.shield=0;}}
 ctx.p.curHp-=dmg;
}
function enemyHit(ctx){doHit(ctx.enemy,ctx.p,ctx.enemy.name,ctx,false);}
function checkEnd(ctx){
 if(ctx.enemy.curHp<=0){win(ctx);return true;}
 if(ctx.p.curHp<=0){
   if(ctx.revive){ctx.revive=false;state.potions.revive--;ctx.p.curHp=Math.floor(ctx.p.hp*0.5);ctx.log.push(`<div class="log heal">复活药剂生效！</div>`);return false;}
   if(GENE[state.geneLock].pass.save && !ctx.deathSave){ctx.deathSave=true;ctx.p.curHp=Math.floor(ctx.p.hp*0.3);ctx.log.push(`<div class="log heal">五阶基因锁免死！</div>`);return false;}
   if(BLOOD[state.bloodline].stages[state.blStage[state.bloodline]].save && !ctx.deathSave){ctx.deathSave=true;ctx.p.curHp=Math.floor(ctx.p.hp*0.3);ctx.log.push(`<div class="log heal">修真免死！</div>`);return false;}
   lose(ctx);return true;
 }
 return false;
}
function win(ctx){
 ctx.win=true;ctx.over=true;ctx.log.push(`<div class="log good">战斗胜利！</div>`);
 giveBattleRewards(ctx.enemy,ctx.enemy.diff,ctx.enemy.stage===12);
 renderBattleLog(ctx.log,true);
 saveGame();
}
function lose(ctx){
 ctx.over=true;ctx.log.push(`<div class="log bad">你战败了...</div>`);
 const loss=Math.floor(state.points*0.08);state.points=Math.max(0,state.points-loss);state.stats.consecutiveLoss++;state.stats.winStreak=0;
 if(state.stats.consecutiveLoss>=3)state.stats.injuryEnd=Date.now()+600000;
 renderBattleLog(ctx.log,false);
 saveGame();
}
function allySkill(cid,ctx){
 const c=getChar(cid); const base=c.skillBase; const spirit=ctx.p.spirit; const name=c.name;
 const amt=(base+c.level*0.02)*spirit;
 switch(c.skillType){
  case 'dmg': case 'dmgLeech': case 'dmgPen': case 'dmgHit': case 'dmgLowHp': case 'dmgCombo': case 'dmgDefDown': case 'trueDmg': case 'trueDmgSeal': case 'stun': case 'dmgEvade': case 'dmgDebuff':
   let dmg=ctx.p.atk*amt; if(c.skillType==='trueDmg'||c.skillType==='trueDmgSeal')dmg=applyDmgMods(dmg,ctx.p,null,true);
   if(c.skillType==='dmgPen')ctx.pBuff.atkPen=0.5;
   ctx.enemy.curHp-=dmg; ctx.log.push(`<div class="log skill">${name}【${c.skillName}】造成 ${fmt(dmg)}</div>`);
   if(c.skillType==='stun' && Math.random()<0.3){ctx.eStun=1;ctx.log.push(`<div class="log skill">敌人眩晕！</div>`);}
   if(c.skillType==='dmgDefDown')ctx.eBuff.def-=0.3;
   if(c.skillType==='dmgLeech'){ctx.p.curHp=Math.min(ctx.p.hp,ctx.p.curHp+dmg*0.5);}
   break;
  case 'heal': case 'healTeam': case 'healCleanse': case 'healShield':
   let h=ctx.p.hp*amt; ctx.p.curHp=Math.min(ctx.p.hp,ctx.p.curHp+h); ctx.log.push(`<div class="log skill heal">${name}【${c.skillName}】回复 ${fmt(h)}</div>`);
   if(c.skillType==='healShield'){ctx.shield+=Math.floor(ctx.p.hp*0.1);ctx.log.push(`<div class="log skill">获得护盾</div>`);}
   break;
  case 'shield': ctx.shield+=Math.floor(ctx.p.hp*amt); ctx.log.push(`<div class="log skill">${name}【${c.skillName}】加护盾</div>`); break;
  case 'evade': ctx.pBuff.eva+=20; ctx.log.push(`<div class="log skill">${name}【${c.skillName}】闪避提升</div>`); break;
  case 'buffAtk': ctx.pBuff.atk+=0.2; break;
  case 'buffAtkCrit': ctx.pBuff.atk+=0.3;ctx.pBuff.crit+=15;ctx.log.push(`<div class="log skill">${name}【${c.skillName}】攻击/暴击提升</div>`); break;
  case 'buffAtkDef': ctx.pBuff.atk+=0.25;ctx.pBuff.def+=0.25;ctx.log.push(`<div class="log skill">${name}【${c.skillName}】攻防提升</div>`); break;
  case 'buffDef': ctx.pBuff.def+=0.25;ctx.log.push(`<div class="log skill">${name}【${c.skillName}】防御提升</div>`); break;
  case 'buffSkill': ctx.p.skillMult+=0.2; break;
  case 'debuffAtk': ctx.eBuff.atk-=0.2;ctx.log.push(`<div class="log skill">${name}【${c.skillName}】削弱敌人攻击</div>`); break;
  case 'taunt': ctx.eStun=1;ctx.log.push(`<div class="log skill">${name}【${c.skillName}】嘲讽眩晕</div>`); break;
 }
}

function challengeGene(){const mirror=combatStats();mirror.hp*=1.1;mirror.atk*=1.1;mirror.def*=1.1;const ctx={enemy:{name:'镜像',maxHp:mirror.hp,hp:mirror.hp,atk:mirror.atk,def:mirror.def,spd:mirror.spd,curHp:mirror.hp},p:mirror,log:[],shield:0,revive:false,deathSave:false,pBuff:{},eBuff:{},pStun:0,eStun:0};openBattleModal(ctx.enemy); simulateBattle(ctx); if(ctx.win){state.geneLock++;toast('基因锁突破！');saveGame();}}

let selMap=1,selDiff='normal';

 MAPS.forEach(m=>h+=`<button class="btn sml ${selMap===m.id?'':'btn2'}" onclick="selMap=${m.id};renderDungeon()">${m.n}</button>`);

 for(let i=1;i<=12;i++){const cleared=prog.includes(i);const boss=i===12;h+=`<div class="stage ${cleared?'cleared':''} ${boss?'boss':''}" onclick="stageAction(${i})">${boss?'👹':i}${cleared?'✓':''}</div>`;}
 h+=`</div>`;
 const canExplore=prog.length>=12;
 h+=`<div class="row" style="margin-top:10px"><button class="btn" onclick="exploreMap()" ${canExplore?'':'disabled'}>探索 (${fmt(500+selMap*200)}点)</button><button class="btn btn3" onclick="openTower()" ${state.tower.unlocked?'':'disabled'}>无限回廊</button></div>`;
 if(!state.tower.unlocked)h+=`<div class="muted">通关14图普通解锁无限回廊</div>`;

function isDiffUnlocked(mid,d){if(d==='normal')return true; const m=state.maps[mid]||{}; if(d==='hard')return (m.normal||[]).length>=12; return (m.hard||[]).length>=12;}
function getMapProg(mid,d){return (state.maps[mid]&&state.maps[mid][d])?state.maps[mid][d]:[];}
function setName(sid){return SETS.find(x=>x.id===sid).n;}
function stageAction(stage){
 const cleared=getMapProg(selMap,selDiff).includes(stage);
 if(cleared && power()>=enemyStats(selMap,stage,selDiff).hp*1.2*0.8+enemyStats(selMap,stage,selDiff).atk+enemyStats(selMap,stage,selDiff).def*0.08){
  if(confirm('已通关，是否扫荡？'))sweepStage(stage);
 } else startBattle(selMap,stage,selDiff);
}
function sweepStage(stage){
 const e=enemyStats(selMap,stage,selDiff); giveBattleRewards(e,selDiff,stage===12);
 toast('扫荡完成'); renderDungeon(); saveGame();
}
function exploreMap(){
 const cost=500+selMap*200; if(state.points<cost){toast('点数不足');return;}
 state.points-=cost; state.stats.explore++;
 const roll=Math.random();
 if(roll<0.25){const n=1+Math.floor(Math.random()*2)+Math.floor(state.dims.intel/50);addMat(selMap,n);toast(`探索获得 ${MAPS[selMap-1].mat}×${n}`);}

 else if(roll<0.55){const it=genItem(selMap*12,null,MAPS[selMap-1].set);state.inventory.push(it);toast('探索获得装备：'+itemName(it));}

// ================= 装备生成 =================
function genItem(level,forceQ,setId,charId){
 const slot=setId?SETS.find(s=>s.id===setId).slots[Math.floor(Math.random()*3)]:randSlot();
 let q=forceQ!==undefined?forceQ:rollQuality();
 const main=SLOT_MAIN[slot];
 let val=main==='all'?5*Math.pow(level,.8):main==='atk'?8*Math.pow(level,.9):main==='def'?6*Math.pow(level,.9):main==='hp'?12*Math.pow(level,.9):2*Math.pow(level,.8);
 val*=QUALITIES[q].m;
 const subs=[];for(let i=0;i<QUALITIES[q].s;i++)subs.push(randSub(level,q));
 const reqClass=Math.random()<0.6?randReqClass(slot):[];
 return {uid:state.nextUid++,slot,q,level,main,val:Math.floor(val),subs,setId:setId||null,reqClass,reqChar:charId||null,enh:0,equippedBy:null};
}
function randSlot(){const r=Math.random();if(r<.2)return 'weapon';if(r<.35)return 'helmet';if(r<.5)return 'armor';if(r<.65)return 'boots';if(r<.8)return 'amulet';return 'emblem';}
function rollQuality(){const r=Math.random()*100;let s=0;for(let i=0;i<QW.length;i++){s+=QW[i];if(r<s)return i;}return 0;}
function randSub(level,q){const stats=['atk','def','hp','spd','intel','spirit','all'];const st=stats[Math.floor(Math.random()*stats.length)];const base=st==='all'?2:st==='hp'?6:3;let v=base*Math.pow(level,.7)*(1+q*0.2);if(['crit','eva'].includes(st))v=1+q;return {stat:st,val:Math.floor(v)};}
function randReqClass(slot){if(slot==='weapon')return [['战士','刺客'],['射手','法师'],['战士','坦克']][Math.floor(Math.random()*3)];if(slot==='armor')return [['战士','坦克'],['法师','辅助']][Math.floor(Math.random()*2)];return [];}
function itemName(it){const qn=QUALITIES[it.q].n;const sn=SLOT_NAME[it.slot];const set=it.setId?SETS.find(s=>s.id===it.setId).n+' ':'';const ex=it.reqChar?'专属 ':'';return `${ex}${qn} ${set}${sn}`;}
function genExclusive(charId){const e=EXCL[charId];const q=4;const it={uid:state.nextUid++,slot:e.slot,q,level:168,main:SLOT_MAIN[e.slot],val:0,subs:[],setId:null,reqClass:[],reqChar:charId,enh:0,equippedBy:null};const base=10*Math.pow(168,.9)*QUALITIES[q].m;it.val=Math.floor(base*(e.slot==='weapon'?1.5:1));it.subs=[{stat:e.eff==='all'?'all':'spirit',val:30}];return it;}

// ================= 奖励 =================
function giveBattleRewards(enemy,diff,isBoss){
 const d=DIFF[diff];
 let pts=Math.floor(enemy.maxHp*0.5*d.dropP); const first=!getMapProg(enemy.mapId,diff).includes(enemy.stage); if(first)pts*=5; else pts*=0.4;
 state.points+=pts;state.stats.totalPoints+=pts;
 if(isBoss){state.plot+=d.plot;state.holy+=d.holy;state.stats.bossKills++;state.stats.winStreak++;state.stats.consecutiveLoss=0;}
 state.stats.kills++;
 // material
 if(Math.random()<0.5)addMat(enemy.mapId,1); if(isBoss)addMat(enemy.mapId,2+Math.floor(Math.random()*3));
 // crystal
 if(Math.random()<0.25){state.crystal+=Math.floor((enemy.stage+enemy.mapId*2)*d.dropP);}
 // equipment drop
 if(Math.random()<0.3 || isBoss){const lv=(enemy.mapId-1)*12+enemy.stage+d.dropP*5;const q=Math.min(4,rollQuality()+Math.floor(d.dropP/2));const it=genItem(lv,q,Math.random()<0.15?MAPS[enemy.mapId-1].set:null);state.inventory.push(it);toast('掉落 '+itemName(it));}
 // map progress
 ensureMap(enemy.mapId); if(!state.maps[enemy.mapId][diff].includes(enemy.stage))state.maps[enemy.mapId][diff].push(enemy.stage);
 // tower unlock
 if(MAPS.every(m=>(state.maps[m.id]?.normal||[]).length>=12))state.tower.unlocked=true;
}

function gmKey(e){if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;keyBuf=(keyBuf+e.key).slice(-14);if(keyBuf.toLowerCase().endsWith('whosyourdaddy'))openGM();}
let verClicks=[],verTimer;
function versionClick(){const now=Date.now();verClicks=verClicks.filter(t=>now-t<2500);verClicks.push(now);if(verClicks.length===3||verClicks.length===4)toast('再点'+verClicks.length+'下也没用哦');if(verClicks.length>=5)openGM();}
function openGM(){
 let h=`<div class="modal-header"><h3>GM 面板</h3><button class="close" onclick="closeModal()">×</button></div>`;
 h+=`<div class="row"><input type="number" id="gP" placeholder="点数"><input type="number" id="gL" placeholder="剧情"><input type="number" id="gC" placeholder="结晶"><input type="number" id="gH" placeholder="圣晶"></div><button class="btn" onclick="gmApply()">应用数值</button>`;
 h+=`<button class="btn" style="display:block;width:100%;margin:6px 0" onclick="gmRich()">一夜暴富</button>`;
 h+=`<button class="btn" style="display:block;width:100%;margin:6px 0" onclick="gmClear()">全图通关</button>`;
 h+=`<button class="btn" style="display:block;width:100%;margin:6px 0" onclick="gmFull()">满状态</button>`;
 openModal(h);
}
function gmApply(){state.points=+document.getElementById('gP').value||0;state.plot=+document.getElementById('gL').value||0;state.crystal=+document.getElementById('gC').value||0;state.holy=+document.getElementById('gH').value||0;saveGame();render();toast('GM 数值已应用');}
function gmRich(){state.points+=1000000;state.crystal+=10000;state.holy+=100;state.plot+=10;saveGame();render();toast('一夜暴富');}
function gmClear(){MAPS.forEach(m=>{ensureMap(m.id);for(let d in DIFF)for(let s=1;s<=12;s++)if(!state.maps[m.id][d].includes(s))state.maps[m.id][d].push(s);});state.tower.unlocked=true;saveGame();render();toast('全图通关');}
function gmFull(){Object.keys(BLOOD).forEach(k=>{state.unlockedBlood[k]=true;state.blStage[k]=2;});state.geneLock=5;state.dims={muscle:200,immune:200,cell:200,nerve:200,intel:200,spirit:200};state.buildings={sanctuary:50,medical:50,training:50};saveGame();render();toast('满状态');}
function openSettings(){
 let h=`<div class="modal-header"><h3>设置</h3><button class="close" onclick="closeModal()">×</button></div>`;
 h+=`<div class="row"><span>当前存档槽</span><select onchange="changeSlot(this.value)"><option value="1" ${(+localStorage.getItem(CUR)||1)===1?'selected':''}>槽1</option><option value="2" ${(+localStorage.getItem(CUR)||1)===2?'selected':''}>槽2</option><option value="3" ${(+localStorage.getItem(CUR)||1)===3?'selected':''}>槽3</option></select></div>`;
 h+=`<button class="btn" style="display:block;width:100%;margin:6px 0" onclick="exportSave()">导出存档</button>`;
 h+=`<textarea id="imp" style="width:100%;height:80px;margin:6px 0" placeholder="粘贴存档"></textarea><button class="btn" style="display:block;width:100%;margin:6px 0" onclick="importSave()">导入存档</button>`;
 h+=`<button class="btn btn2" style="display:block;width:100%;margin:6px 0" onclick="if(confirm('重置当前存档？')){localStorage.removeItem('wxlh_slot_'+(+localStorage.getItem(CUR)||1));location.reload();}">重置当前存档</button>`;
 h+=`<div style="margin-top:20px;text-align:center;color:#666;font-size:12px" onclick="versionClick()">无限轮回 v1.0</div>`;
 openModal(h);
}
function changeSlot(n){localStorage.setItem(CUR,n);location.reload();}
function exportSave(){const s=JSON.stringify(state);navigator.clipboard.writeText(s).then(()=>toast('已复制存档'));document.getElementById('imp').value=s;}
function importSave(){try{const s=JSON.parse(document.getElementById('imp').value);state=s;saveGame();location.reload();}catch(e){toast('存档格式错误');}}

// ================= 新手引导 =================
function showIntro(){
 let h=`<div class="modal-header"><h3>想明白生命的意义吗？</h3></div>`;
 h+=`<p>想真正的……活着吗？</p>`;
 h+=`<button class="btn" style="display:block;width:100%;margin:6px 0" onclick="introYes()">想</button>`;
 h+=`<button class="btn btn2" style="display:block;width:100%;margin:6px 0" onclick="introNo()">不想</button>`;
 openModal(h);
}
function introNo(){toast('检测到谎言 100%，强制进入轮回');introYes();}
function introYes(){
 let h=`<div class="modal-header"><h3>输入代号</h3></div><input id="iname" maxlength="8" placeholder="2-8字">`;
 h+=`<h4>选择初始血统</h4>`;
 Object.keys(BLOOD).forEach(k=>h+=`<button class="btn" style="display:block;width:100%;margin:4px 0" onclick="finishIntro('${k}')">${BLOOD[k].n}</button>`);
 openModal(h);
}
function finishIntro(blood){
 const n=document.getElementById('iname').value.trim(); if(n.length<2||n.length>8){toast('代号需2-8字');return;}
 state.name=n; state.bloodline=blood; state.unlockedBlood[blood]=true; state.flags.intro=false; state.points=500; state.potions={atk:1,shield:1,revive:0};
 saveGame(); closeModal(); render();
 toast('欢迎来到主神空间');
}

// 启动
init();
</script>
</body>
</html>
