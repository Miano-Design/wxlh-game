<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>无限轮回 — 原型</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>无限轮回（原型）</h1>
      <div id="resources">点数：<span id="res-points">0</span></div>
    </header>

    <main id="main-screen">
      <button id="btn-start">开始轮回</button>
      <div id="home" class="panel">
        <h2>主神空间</h2>
        <div id="party"></div>
        <div class="controls">
          <button id="btn-venture">进入副本（战斗演示）</button>
          <button id="btn-save">保存进度</button>
          <button id="btn-load">读取进度</button>
        </div>
      </div>

      <div id="battle" class="panel hidden">
        <h2>战斗</h2>
        <div id="battle-log"></div>
        <div class="controls">
          <button id="btn-attack">执行战斗回合</button>
          <button id="btn-end-battle">结束战斗</button>
        </div>
      </div>

    </main>

    <footer>
      <small>演示版 — 静态部署支持手机访问（GitHub Pages）</small>
    </footer>
  </div>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
